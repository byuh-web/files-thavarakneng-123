<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" role="img" aria-labelledby="title desc">
<title id="title">Original planet comparison illustration</title>
<desc id="desc">Simple planet icons lined up from small to large.</desc>
<rect width="700" height="460" fill="#07111f"/>
<g fill="#fff" opacity="0.7"><circle cx="78" cy="72" r="2"/><circle cx="548" cy="58" r="1.4"/><circle cx="635" cy="310" r="1.6"/><circle cx="190" cy="365" r="1.3"/></g>
<line x1="80" y1="335" x2="620" y2="335" stroke="#79d2ff" stroke-width="3" opacity="0.5"/>
<circle cx="120" cy="315" r="16" fill="#cbd1d8"/><text x="120" y="365" text-anchor="middle" fill="#f5f7fb" font-family="Arial" font-size="16">Moon</text>
<circle cx="210" cy="305" r="26" fill="#c95c36"/><text x="210" y="365" text-anchor="middle" fill="#f5f7fb" font-family="Arial" font-size="16">Mars</text>
<circle cx="340" cy="275" r="56" fill="#5cb3ff"/><text x="340" y="365" text-anchor="middle" fill="#f5f7fb" font-family="Arial" font-size="16">Earth</text>
<circle cx="500" cy="240" r="91" fill="#c2885a"/><text x="500" y="365" text-anchor="middle" fill="#f5f7fb" font-family="Arial" font-size="16">Jupiter</text>
<text x="350" y="90" text-anchor="middle" fill="#f9b342" font-family="Arial" font-size="30" font-weight="700">Planet Size Comparison</text>
</svg>
